<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" style="background: #f8fafc; font-family: Arial, sans-serif;">
  <!-- Título -->
  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e293b">Arquitectura en Capas del Sistema Operativo</text>

  <!-- Subtítulo -->
  <text x="450" y="65" text-anchor="middle" font-size="14" fill="#64748b">Cada capa solo puede llamar a la capa inmediatamente inferior</text>

  <!-- Capas -->
  <!-- Capa 5: Aplicaciones -->
  <g id="capa5">
    <rect x="150" y="100" width="600" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Capa 5: Programas de Usuario</text>
    <text x="450" y="145" text-anchor="middle" font-size="12" fill="#64748b">Compiladores, navegadores, juegos, procesadores de texto</text>
  </g>

  <!-- Flecha hacia abajo -->
  <line x1="450" y1="160" x2="450" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead-down)"/>

  <!-- Capa 4: Utilidades -->
  <g id="capa4">
    <rect x="150" y="180" width="600" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="450" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">Capa 4: Utilidades del Sistema</text>
    <text x="450" y="225" text-anchor="middle" font-size="12" fill="#64748b">Shell, editores, comandos del sistema</text>
  </g>

  <!-- Flecha hacia abajo -->
  <line x1="450" y1="240" x2="450" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead-down)"/>

  <!-- Capa 3: Gestión de Recursos -->
  <g id="capa3">
    <rect x="150" y="260" width="600" height="60" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="450" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#6b21a8">Capa 3: Gestión de Recursos</text>
    <text x="450" y="305" text-anchor="middle" font-size="12" fill="#64748b">Gestión de memoria, archivos, procesos, E/S</text>
  </g>

  <!-- Flecha hacia abajo -->
  <line x1="450" y1="320" x2="450" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead-down)"/>

  <!-- Capa 2: Núcleo del SO -->
  <g id="capa2">
    <rect x="150" y="340" width="600" height="60" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="450" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">Capa 2: Núcleo del Sistema Operativo</text>
    <text x="450" y="385" text-anchor="middle" font-size="12" fill="#64748b">Planificador, control de dispositivos, comunicación</text>
  </g>

  <!-- Flecha hacia abajo -->
  <line x1="450" y1="400" x2="450" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead-down)"/>

  <!-- Capa 1: Hardware -->
  <g id="capa1">
    <rect x="150" y="420" width="600" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="445" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Capa 1: Hardware</text>
    <text x="450" y="465" text-anchor="middle" font-size="12" fill="#64748b">CPU, memoria, discos, red, dispositivos E/S</text>
  </g>

  <!-- Definición de flecha -->
  <defs>
    <marker id="arrowhead-down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Nota al lado -->
  <g id="nota">
    <rect x="780" y="150" width="100" height="200" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="830" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Beneficios:</text>
    <text x="790" y="200" font-size="10" fill="#64748b">✓ Modularidad</text>
    <text x="790" y="220" font-size="10" fill="#64748b">✓ Facil mantenimiento</text>
    <text x="790" y="240" font-size="10" fill="#64748b">✓ Más seguro</text>
    <text x="790" y="260" font-size="10" fill="#64748b">✓ Abstracción</text>
    <text x="790" y="290" font-size="10" fill="#dc2626">✗ Overhead</text>
    <text x="790" y="310" font-size="10" fill="#dc2626">✗ Más lento</text>
  </g>

  <!-- Ejemplo de llamada -->
  <g id="ejemplo">
    <rect x="50" y="500" width="800" height="80" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="450" y="525" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">Ejemplo: Cuando guardas un archivo en Word</text>
    <text x="450" y="545" text-anchor="middle" font-size="11" fill="#92400e">Word → Utilidades → Gestión Archivos → Kernel → Hardware (disco)</text>
    <text x="450" y="562" text-anchor="middle" font-size="10" fill="#a16207" font-style="italic">La llamada baja capa por capa, cada una añade su funcionalidad</text>
  </g>
</svg>