<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background: #f8fafc; font-family: Arial, sans-serif;">
  <!-- Título -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">Estados de un Proceso</text>

  <!-- Estados -->
  <!-- NEW -->
  <g id="estado-new">
    <rect x="50" y="100" width="120" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">NEW</text>
    <text x="110" y="145" text-anchor="middle" font-size="11" fill="#64748b">Creado</text>
  </g>

  <!-- READY -->
  <g id="estado-ready">
    <rect x="250" y="100" width="120" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="310" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">READY</text>
    <text x="310" y="145" text-anchor="middle" font-size="11" fill="#64748b">Listo</text>
  </g>

  <!-- RUNNING -->
  <g id="estado-running">
    <rect x="450" y="100" width="120" height="60" rx="10" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
    <text x="510" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">RUNNING</text>
    <text x="510" y="145" text-anchor="middle" font-size="11" fill="#64748b">Ejecutando</text>
  </g>

  <!-- BLOCKED -->
  <g id="estado-blocked">
    <rect x="450" y="300" width="120" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="510" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">BLOCKED</text>
    <text x="510" y="345" text-anchor="middle" font-size="11" fill="#64748b">Esperando I/O</text>
  </g>

  <!-- TERMINATED -->
  <g id="estado-terminated">
    <rect x="250" y="300" width="120" height="60" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <text x="310" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">TERMINATED</text>
    <text x="310" y="345" text-anchor="middle" font-size="11" fill="#64748b">Finalizado</text>
  </g>

  <!-- Flechas de transición -->
  <!-- NEW -> READY (admit) -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <line x1="170" y1="130" x2="240" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="205" y="120" text-anchor="middle" font-size="11" fill="#64748b">admit</text>

  <!-- READY -> RUNNING (scheduler) -->
  <line x1="370" y1="130" x2="440" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="405" y="120" text-anchor="middle" font-size="11" fill="#16a34a">scheduler</text>

  <!-- RUNNING -> READY (timeout/interrupt) -->
  <line x1="450" y1="110" x2="380" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="415" y="100" text-anchor="middle" font-size="10" fill="#16a34a">timeout</text>

  <!-- RUNNING -> BLOCKED (I/O request) -->
  <line x1="510" y1="160" x2="510" y2="290" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="540" y="230" text-anchor="middle" font-size="10" fill="#dc2626" transform="rotate(90, 540, 230)">I/O request</text>

  <!-- BLOCKED -> READY (I/O complete) -->
  <line x1="450" y1="330" x2="380" y2="330" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="415" y="320" text-anchor="middle" font-size="10" fill="#16a34a">I/O complete</text>

  <!-- RUNNING -> TERMINATED (exit) -->
  <line x1="450" y1="150" x2="370" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="380" y="210" text-anchor="middle" font-size="10" fill="#6b7280" transform="rotate(-55, 380, 210)">exit</text>

  <!-- Notas explicativas -->
  <g id="notas">
    <rect x="630" y="80" width="150" height="150" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="705" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Transiciones:</text>
    <text x="640" y="120" font-size="10" fill="#64748b">• <tspan font-weight="bold">admit:</tspan> Nuevo a listo</text>
    <text x="640" y="138" font-size="10" fill="#64748b">• <tspan font-weight="bold">scheduler:</tspan> A CPU</text>
    <text x="640" y="156" font-size="10" fill="#64748b">• <tspan font-weight="bold">timeout:</tspan> Se acabó tiempo</text>
    <text x="640" y="174" font-size="10" fill="#64748b">• <tspan font-weight="bold">I/O request:</tspan> Espera</text>
    <text x="640" y="192" font-size="10" fill="#64748b">• <tspan font-weight="bold">I/O complete:</tspan> Despierta</text>
    <text x="640" y="210" font-size="10" fill="#64748b">• <tspan font-weight="bold">exit:</tspan> Finaliza</text>
  </g>

  <!-- Leyenda de colores -->
  <g id="leyenda">
    <rect x="50" y="400" width="15" height="15" fill="#dbeafe"/>
    <text x="70" y="412" font-size="11" fill="#64748b">Creado</text>

    <rect x="150" y="400" width="15" height="15" fill="#dcfce7"/>
    <text x="170" y="412" font-size="11" fill="#64748b">Listo para ejecutar</text>

    <rect x="300" y="400" width="15" height="15" fill="#fef3c7"/>
    <text x="320" y="412" font-size="11" fill="#64748b">Usando CPU</text>

    <rect x="420" y="400" width="15" height="15" fill="#fee2e2"/>
    <text x="440" y="412" font-size="11" fill="#64748b">Esperando I/O</text>

    <rect x="550" y="400" width="15" height="15" fill="#e5e7eb"/>
    <text x="570" y="412" font-size="11" fill="#64748b">Finalizado</text>
  </g>
</svg>