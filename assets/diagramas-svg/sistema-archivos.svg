<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="background: #f8fafc; font-family: Arial, sans-serif;">
  <!-- Título -->
  <text x="500" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">Estructura de Inodos (Linux/Unix)</text>

  <!-- Subtítulo -->
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#64748b">Cómo Unix organiza archivos en disco usando inodos</text>

  <!-- Comparación de Sistemas de Archivos -->
  <g id="comparacion-fs">
    <rect x="50" y="80" width="900" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="500" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">Comparación: FAT32 vs NTFS vs ext4</text>
    <text x="250" y="120" text-anchor="middle" font-size="11" fill="#92400e">FAT32: Tabla de asignación simple</text>
    <text x="500" y="120" text-anchor="middle" font-size="11" fill="#92400e">NTFS: Journaling, ACLs, compresión</text>
    <text x="750" y="120" text-anchor="middle" font-size="11" fill="#92400e">ext4: Journaling, extents, inodos</text>
  </g>

  <!-- Estructura de Inodo -->
  <g id="inodo-estructura">
    <text x="250" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Estructura de un Inodo</text>

    <!-- Inodo -->
    <rect x="50" y="190" width="400" height="220" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

    <!-- Campos del inodo -->
    <g id="campos-inodo">
      <rect x="70" y="210" width="150" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="145" y="227" text-anchor="middle" font-size="10" fill="#64748b">Tipo de archivo</text>
      <rect x="250" y="210" width="180" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="340" y="227" text-anchor="middle" font-size="10" fill="#1e40af">- (regular, dir, symlink)</text>

      <rect x="70" y="245" width="150" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="145" y="262" text-anchor="middle" font-size="10" fill="#64748b">Permisos</text>
      <rect x="250" y="245" width="180" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="340" y="262" text-anchor="middle" font-size="10" fill="#1e40af">rwxrwxrwx (9 bits)</text>

      <rect x="70" y="280" width="150" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="145" y="297" text-anchor="middle" font-size="10" fill="#64748b">UID del dueño</text>
      <rect x="250" y="280" width="180" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="340" y="297" text-anchor="middle" font-size="10" fill="#1e40af">32 bits (0-4294967295)</text>

      <rect x="70" y="315" width="150" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="145" y="332" text-anchor="middle" font-size="10" fill="#64748b">GID del grupo</text>
      <rect x="250" y="315" width="180" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="340" y="332" text-anchor="middle" font-size="10" fill="#1e40af">32 bits</text>

      <rect x="70" y="350" width="150" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="145" y="367" text-anchor="middle" font-size="10" fill="#64748b">Tamaño (bytes)</text>
      <rect x="250" y="350" width="180" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="340" y="367" text-anchor="middle" font-size="10" fill="#1e40af">64 bits (hasta 16TB)</text>

      <rect x="70" y="385" width="150" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="145" y="402" text-anchor="middle" font-size="10" fill="#64748b">Timestamps</text>
      <rect x="250" y="385" width="180" height="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="340" y="402" text-anchor="middle" font-size="10" fill="#1e40af">mtime, atime, ctime</text>
    </g>
  </g>

  <!-- Punteros a Bloques -->
  <g id="punteros-bloques">
    <text x="700" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Punteros a Bloques de Datos</text>

    <rect x="500" y="220" width="450" height="190" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <!-- Punteros directos -->
    <g id="directos">
      <rect x="520" y="240" width="120" height="20" fill="#22c55e" opacity="0.8"/>
      <text x="580" y="254" text-anchor="middle" font-size="10" fill="white">i_block[0]</text>
      <rect x="680" y="240" width="200" height="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
      <text x="780" y="254" text-anchor="middle" font-size="10" fill="#92400e">Bloque 0 (4KB)</text>

      <rect x="520" y="265" width="120" height="20" fill="#22c55e" opacity="0.8"/>
      <text x="580" y="279" text-anchor="middle" font-size="10" fill="white">i_block[1]</text>
      <rect x="680" y="265" width="200" height="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
      <text x="780" y="279" text-anchor="middle" font-size="10" fill="#92400e">Bloque 1 (4KB)</text>

      <rect x="520" y="290" width="120" height="20" fill="#22c55e" opacity="0.8"/>
      <text x="580" y="304" text-anchor="middle" font-size="10" fill="white">...</text>
      <rect x="680" y="290" width="200" height="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
      <text x="780" y="304" text-anchor="middle" font-size="10" fill="#92400e">...</text>

      <rect x="520" y="315" width="120" height="20" fill="#22c55e" opacity="0.8"/>
      <text x="580" y="329" text-anchor="middle" font-size="10" fill="white">i_block[11]</text>
      <rect x="680" y="315" width="200" height="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
      <text x="780" y="329" text-anchor="middle" font-size="10" fill="#92400e">Bloque 11 (4KB)</text>
      <text x="920" y="329" text-anchor="start" font-size="9" fill="#16a34a">48KB max</text>
    </g>

    <!-- Indirecto simple -->
    <g id="indirecto-simple">
      <rect x="520" y="345" width="120" height="20" fill="#f59e0b" opacity="0.8"/>
      <text x="580" y="359" text-anchor="middle" font-size="10" fill="white">i_block[12]</text>
      <rect x="680" y="345" width="200" height="20" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
      <text x="780" y="359" text-anchor="middle" font-size="10" fill="#9a3412">Indirecto simple</text>
      <text x="920" y="359" text-anchor="start" font-size="9" fill="#16a34a">→ 4MB más</text>
    </g>

    <!-- Indirecto doble -->
    <g id="indirecto-doble">
      <rect x="520" y="375" width="120" height="20" fill="#ef4444" opacity="0.8"/>
      <text x="580" y="389" text-anchor="middle" font-size="10" fill="white">i_block[13]</text>
      <rect x="680" y="375" width="200" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="780" y="389" text-anchor="middle" font-size="10" fill="#991b1b">Indirecto doble</text>
      <text x="920" y="389" text-anchor="start" font-size="9" fill="#dc2626">→ 4GB más</text>
    </g>

    <!-- Indirecto triple -->
    <g id="indirecto-triple">
      <rect x="520" y="405" width="120" height="20" fill="#8b5cf6" opacity="0.8"/>
      <text x="580" y="419" text-anchor="middle" font-size="10" fill="white">i_block[14]</text>
      <rect x="680" y="405" width="200" height="20" fill="#f3e8ff" stroke="#9333ea" stroke-width="1"/>
      <text x="780" y="419" text-anchor="middle" font-size="10" fill="#6b21a8">Indirecto triple</text>
      <text x="920" y="419" text-anchor="start" font-size="9" fill="#6b21a8">→ 4TB más</text>
    </g>
  </g>

  <!-- Ventajas de Inodos -->
  <g id="ventajas-inodos">
    <rect x="50" y="440" width="400" height="180" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="250" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Ventajas del Sistema de Inodos</text>

    <text x="60" y="485" font-size="11" fill="#4f46e5"><tspan font-weight="bold">1. Acceso rápido:</tspan> Directorios contienen solo nombres + inodo #</text>
    <text x="60" y="505" font-size="11" fill="#4f46e5"><tspan font-weight="bold">2. Archivos rápidos:</tspan> St_atime no requiere abrir archivo</text>
    <text x="60" y="525" font-size="11" fill="#4f46e5"><tspan font-weight="bold">3. Links físicos:</tspan> Varios nombres pueden apuntar al mismo inodo</text>
    <text x="60" y="545" font-size="11" fill="#4f46e5"><tspan font-weight="bold">4. Estructura flexible:</tspan> Extents en ext4 son muy eficientes</text>
    <text x="60" y="565" font-size="11" fill="#4f46e5"><tspan font-weight="bold">5. Journaling:</tspan> Recuperación rápida tras caídas</text>
    <text x="60" y="585" font-size="11" fill="#4f46e5"><tspan font-weight="bold">6. Permisos granulares:</tspan> ACLs para control fino</text>
  </g>

  <!-- Notas importantes -->
  <g id="notas">
    <rect x="500" y="440" width="450" height="180" rx="5" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="725" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Conceptos Clave</text>

    <text x="520" y="485" font-size="11" fill="#64748b"><tspan font-weight="bold">Inodo #:</tspan> Identificador único (como un número de seguro social)</text>
    <text x="520" y="505" font-size="11" fill="#64748b"><tspan font-weight="bold">Links:</tspan> Cada inodo cuenta cuántos nombres apuntan a él (nlink)</text>
    <text x="520" y="525" font-size="11" fill="#64748b"><tspan font-weight="bold">Extents:</tspan> Bloques consecutivos (ext4) mejoran rendimiento</text>
    <text x="520" y="545" font-size="11" fill="#dc2626"><tspan font-weight="bold">Sin inodos:</tspan> No puedes borrar un archivo abierto (en uso)</text>
    <text x="520" y="565" font-size="11" fill="#dc2626"><tspan font-weight="bold">Sin inodos:</tspan> El archivo se borra cuando nlink = 0</text>
    <text x="520" y="585" font-size="11" fill="#16a34a"><tspan font-weight="bold">df -i:</tspan> Ver inodos disponibles (no solo espacio en disco)</text>
  </g>

  <!-- Comandos útiles -->
  <g id="comandos">
    <rect x="50" y="640" width="900" height="40" rx="5" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
    <text x="500" y="660" text-anchor="middle" font-size="12" fill="#9a3412">Comandos útiles: ls -li (ver inodos), df -i (inodos libres), stat archivo (info completa), ln archivo1 archivo2 (hard link)</text>
  </g>
</svg>