<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" style="background: #f8fafc; font-family: Arial, sans-serif;">
  <!-- Título -->
  <text x="450" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">Sección Crítica y Sincronización</text>

  <!-- Subtítulo -->
  <text x="450" y="55" text-anchor="middle" font-size="13" fill="#64748b">El problema de la exclusión mutua y sus soluciones</text>

  <!-- Definición de Sección Crítica -->
  <g id="definicion">
    <rect x="50" y="80" width="800" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="450" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">¿Qué es la Sección Crítica?</text>
    <text x="450" y="120" text-anchor="middle" font-size="12" fill="#7f1d1d">Fragmento de código que accede a recursos compartidos y donde SOLO UN proceso puede estar a la vez</text>
    <text x="450" y="135" text-anchor="middle" font-size="11" fill="#991b1b" font-style="italic">Si dos procesos entran simultáneamente → Race condition → Datos corruptos</text>
  </g>

  <!-- Problema del Race Condition -->
  <g id="race-condition">
    <text x="200" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">❌ Race Condition (Problema)</text>

    <!-- Proceso A -->
    <g id="proceso-a">
      <rect x="50" y="200" width="300" height="100" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="200" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Proceso A</text>
      <text x="60" y="240" font-size="11" fill="#64748b">1. Lee contador = 5</text>
      <text x="60" y="260" font-size="11" fill="#64748b">2. Interrupción</text>
      <text x="60" y="280" font-size="11" fill="#64748b">3. Escribe contador = 6</text>
    </g>

    <!-- Proceso B -->
    <g id="proceso-b">
      <rect x="400" y="200" width="300" height="100" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="550" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Proceso B</text>
      <text x="410" y="240" font-size="11" fill="#64748b">1. Lee contador = 5</text>
      <text x="410" y="260" font-size="11" fill="#64748b">2. Escribe contador = 6</text>
      <text x="410" y="280" font-size="11" fill="#64748b">3. Termina</text>
    </g>

    <!-- Resultado incorrecto -->
    <g id="resultado-incorrecto">
      <rect x="750" y="200" width="100" height="100" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="800" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Resultado</text>
      <text x="800" y="250" text-anchor="middle" font-size="20" fill="#dc2626">6</text>
      <text x="800" y="275" text-anchor="middle" font-size="10" fill="#7f1d1d">(Debería ser 7)</text>
    </g>
  </g>

  <!-- Requisitos de Solución -->
  <g id="requisitos">
    <rect x="50" y="330" width="400" height="120" rx="5" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
    <text x="250" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">3 Requisitos para Solucionar</text>
    <text x="60" y="375" font-size="11" fill="#92400e"><tspan font-weight="bold">1. Exclusión Mutua:</tspan> Si P1 en SC, P2 no puede entrar</text>
    <text x="60" y="395" font-size="11" fill="#92400e"><tspan font-weight="bold">2. Progreso:</tspan> Si nadie en SC, quien solicita debe entrar</text>
    <text x="60" y="415" font-size="11" fill="#92400e"><tspan font-weight="bold">3. Espera Limitada:</tspan> Nadie espera indefinidamente</text>
  </g>

  <!-- Solución con Semáforo -->
  <g id="solucion-semaforo">
    <text x="680" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">✓ Solución con Semáforo</text>

    <!-- Semáforo -->
    <g id="semaforo">
      <circle cx="680" cy="400" r="30" fill="#22c55e" stroke="#16a34a" stroke-width="3"/>
      <text x="680" y="405" text-anchor="middle" font-size="18" font-weight="bold" fill="white">1</text>
      <text x="680" y="445" text-anchor="middle" font-size="11" fill="#166534">semáforo = 1</text>
    </g>

    <!-- Operaciones -->
    <g id="operaciones">
      <rect x="550" y="470" width="120" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="610" y="490" text-anchor="middle" font-size="11" fill="#1e40af">wait(sem)</text>
      <text x="610" y="520" text-anchor="middle" font-size="9" fill="#64748b">Decrementa</text>
      <text x="610" y="535" text-anchor="middle" font-size="9" fill="#64748b">Si =0, bloquea</text>

      <rect x="690" y="470" width="120" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="750" y="490" text-anchor="middle" font-size="11" fill="#166534">signal(sem)</text>
      <text x="750" y="520" text-anchor="middle" font-size="9" fill="#64748b">Incrementa</text>
      <text x="750" y="535" text-anchor="middle" font-size="9" fill="#64748b">Desbloquea</text>
    </g>
  </g>

  <!-- Código de ejemplo -->
  <g id="codigo-ejemplo">
    <rect x="50" y="480" width="450" height="150" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="275" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">Ejemplo en C con Semáforo</text>
    <text x="60" y="520" font-size="10" fill="#22c55e">sem_t sem;</text>
    <text x="60" y="535" font-size="10" fill="#22c55e">sem_init(&amp;sem, 0, 1);</text>
    <text x="60" y="555" font-size="10" fill="#f8fafc">sem_wait(&amp;sem);  // Entrar a SC</text>
    <text x="60" y="575" font-size="10" fill="#f8fafc">    // Sección crítica</text>
    <text x="60" y="590" font-size="10" fill="#f8fafc">    contador++;</text>
    <text x="60" y="610" font-size="10" fill="#f8fafc">sem_post(&amp;sem);  // Salir de SC</text>
  </g>

  <!-- Mutex vs Semáforo -->
  <g id="mutex-vs-sem">
    <rect x="520" y="560" width="330" height="80" rx="5" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="685" y="580" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Mutex vs Semáforo</text>
    <text x="530" y="600" font-size="10" fill="#64748b">• <tspan font-weight="bold">Mutex:</tspan> Solo el dueño puede liberar (binary semaphore)</text>
    <text x="530" y="620" font-size="10" fill="#64748b">• <tspan font-weight="bold">Semáforo:</tspan> Cualquier proceso puede liberar</text>
  </g>
</svg>