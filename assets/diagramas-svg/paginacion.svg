<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" style="background: #f8fafc; font-family: Arial, sans-serif;">
  <!-- Título -->
  <text x="500" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">Paginación y Memoria Virtual</text>

  <!-- Subtítulo -->
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#64748b">Cómo el SO abstrae la memoria física usando páginas</text>

  <!-- Conceptos fundamentales -->
  <g id="conceptos">
    <rect x="50" y="80" width="900" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Conceptos Fundamentales</text>
    <text x="100" y="120" font-size="11" fill="#64748b"><tspan font-weight="bold">Página:</tspan> Unidad fija de memoria lógica (típicamente 4KB)</text>
    <text x="450" y="120" font-size="11" fill="#64748b"><tspan font-weight="bold">Marco (Frame):</tspan> Unidad fija de memoria física</text>
    <text x="780" y="120" font-size="11" fill="#64748b"><tspan font-weight="bold">MMU:</tspan> Hardware que traduce direcciones</text>
  </g>

  <!-- Memoria Lógica del Proceso -->
  <g id="memoria-logica">
    <text x="200" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Memoria Lógica del Proceso</text>

    <!-- Espacio lógico -->
    <rect x="50" y="200" width="300" height="250" rx="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <text x="200" y="220" text-anchor="middle" font-size="12" fill="#64748b">Espacio de direcciones lógicas</text>

    <!-- Páginas lógicas -->
    <rect x="70" y="230" width="260" height="30" fill="#3b82f6" opacity="0.7"/>
    <text x="200" y="250" text-anchor="middle" font-size="11" fill="white">Página 0 (0x0000 - 0x0FFF)</text>

    <rect x="70" y="265" width="260" height="30" fill="#22c55e" opacity="0.7"/>
    <text x="200" y="285" text-anchor="middle" font-size="11" fill="white">Página 1 (0x1000 - 0x1FFF)</text>

    <rect x="70" y="300" width="260" height="30" fill="#f59e0b" opacity="0.7"/>
    <text x="200" y="320" text-anchor="middle" font-size="11" fill="white">Página 2 (0x2000 - 0x2FFF)</text>

    <rect x="70" y="335" width="260" height="30" fill="#ef4444" opacity="0.7"/>
    <text x="200" y="355" text-anchor="middle" font-size="11" fill="white">Página 3 (0x3000 - 0x3FFF)</text>

    <rect x="70" y="370" width="260" height="30" fill="#8b5cf6" opacity="0.7"/>
    <text x="200" y="390" text-anchor="middle" font-size="11" fill="white">Página 4 (0x4000 - 0x4FFF)</text>

    <rect x="70" y="405" width="260" height="30" fill="#ec4899" opacity="0.7"/>
    <text x="200" y="425" text-anchor="middle" font-size="11" fill="white">... más páginas ...</text>
  </g>

  <!-- Tabla de Páginas -->
  <g id="tabla-paginas">
    <text x="550" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Tabla de Páginas (Page Table)</text>

    <!-- Tabla -->
    <rect x="400" y="200" width="300" height="200" rx="5" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>

    <!-- Encabezados -->
    <text x="460" y="225" font-size="11" font-weight="bold" fill="#9a3412">Página Lógica</text>
    <text x="620" y="225" font-size="11" font-weight="bold" fill="#9a3412">Marco Físico</text>
    <line x1="400" y1="230" x2="700" y2="230" stroke="#ca8a04" stroke-width="1"/>

    <!-- Filas -->
    <rect x="410" y="240" width="70" height="25" fill="#3b82f6" opacity="0.5"/>
    <text x="445" y="257" text-anchor="middle" font-size="10" fill="white">0</text>
    <rect x="580" y="240" width="70" height="25" fill="#3b82f6" opacity="0.5"/>
    <text x="615" y="257" text-anchor="middle" font-size="10" fill="white">3</text>
    <line x1="490" y1="252" x2="580" y2="252" stroke="#ca8a04" stroke-width="1" marker-end="url(#arrow-small)"/>

    <rect x="410" y="270" width="70" height="25" fill="#22c55e" opacity="0.5"/>
    <text x="445" y="287" text-anchor="middle" font-size="10" fill="white">1</text>
    <rect x="580" y="270" width="70" height="25" fill="#22c55e" opacity="0.5"/>
    <text x="615" y="287" text-anchor="middle" font-size="10" fill="white">7</text>
    <line x1="490" y1="282" x2="580" y2="282" stroke="#ca8a04" stroke-width="1" marker-end="url(#arrow-small)"/>

    <rect x="410" y="300" width="70" height="25" fill="#f59e0b" opacity="0.5"/>
    <text x="445" y="317" text-anchor="middle" font-size="10" fill="white">2</text>
    <rect x="580" y="300" width="70" height="25" fill="#f59e0b" opacity="0.5"/>
    <text x="615" y="317" text-anchor="middle" font-size="10" fill="white">5</text>
    <line x1="490" y1="312" x2="580" y2="312" stroke="#ca8a04" stroke-width="1" marker-end="url(#arrow-small)"/>

    <rect x="410" y="330" width="70" height="25" fill="#ef4444" opacity="0.5"/>
    <text x="445" y="347" text-anchor="middle" font-size="10" fill="white">3</text>
    <rect x="580" y="330" width="70" height="25" fill="#ef4444" opacity="0.5"/>
    <text x="615" y="347" text-anchor="middle" font-size="10" fill="white">2</text>
    <line x1="490" y1="342" x2="580" y2="342" stroke="#ca8a04" stroke-width="1" marker-end="url(#arrow-small)"/>

    <rect x="410" y="360" width="70" height="25" fill="#8b5cf6" opacity="0.5"/>
    <text x="445" y="377" text-anchor="middle" font-size="10" fill="white">4</text>
    <rect x="580" y="360" width="70" height="25" fill="#8b5cf6" opacity="0.5"/>
    <text x="615" y="377" text-anchor="middle" font-size="10" fill="white">1</text>
    <line x1="490" y1="372" x2="580" y2="372" stroke="#ca8a04" stroke-width="1" marker-end="url(#arrow-small)"/>

    <defs>
      <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="2" orient="auto">
        <polygon points="0 0, 8 2, 0 4" fill="#ca8a04"/>
      </marker>
    </defs>
  </g>

  <!-- Memoria Física -->
  <g id="memoria-fisica">
    <text x="850" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Memoria Física (RAM)</text>

    <!-- Memoria física -->
    <rect x="750" y="200" width="200" height="350" rx="5" fill="white" stroke="#16a34a" stroke-width="2"/>
    <text x="850" y="220" text-anchor="middle" font-size="12" fill="#64748b">RAM física</text>

    <!-- Marcos físicos -->
    <rect x="760" y="235" width="180" height="30" fill="#8b5cf6" opacity="0.7"/>
    <text x="850" y="255" text-anchor="middle" font-size="10" fill="white">Marco 1 (Página 4)</text>

    <rect x="760" y="270" width="180" height="30" fill="#ef4444" opacity="0.7"/>
    <text x="850" y="290" text-anchor="middle" font-size="10" fill="white">Marco 2 (Página 3)</text>

    <rect x="760" y="305" width="180" height="30" fill="#f59e0b" opacity="0.7"/>
    <text x="850" y="325" text-anchor="middle" font-size="10" fill="white">Marco 3 (Otro proceso)</text>

    <rect x="760" y="340" width="180" height="30" fill="#f59e0b" opacity="0.7"/>
    <text x="850" y="360" text-anchor="middle" font-size="10" fill="white">Marco 4 (Página 2)</text>

    <rect x="760" y="375" width="180" height="30" fill="#22c55e" opacity="0.7"/>
    <text x="850" y="395" text-anchor="middle" font-size="10" fill="white">Marco 5 (Otro proceso)</text>

    <rect x="760" y="410" width="180" height="30" fill="#22c55e" opacity="0.7"/>
    <text x="850" y="430" text-anchor="middle" font-size="10" fill="white">Marco 6 (Otro proceso)</text>

    <rect x="760" y="445" width="180" height="30" fill="#22c55e" opacity="0.7"/>
    <text x="850" y="465" text-anchor="middle" font-size="10" fill="white">Marco 7 (Página 1)</text>

    <rect x="760" y="480" width="180" height="30" fill="#3b82f6" opacity="0.7"/>
    <text x="850" y="500" text-anchor="middle" font-size="10" fill="white">Marco 8 (Página 0)</text>

    <rect x="760" y="515" width="180" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="850" y="535" text-anchor="middle" font-size="10" fill="#64748b">Marco libre...</text>
  </g>

  <!-- Proceso de traducción -->
  <g id="traduccion">
    <rect x="50" y="480" width="900" height="100" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="500" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Proceso de Traducción de Direcciones</text>

    <text x="100" y="525" font-size="11" fill="#4f46e5">1. CPU genera dirección lógica</text>
    <text x="350" y="525" font-size="11" fill="#4f46e5">→ 2. Divide en número de página + offset</text>
    <text x="650" y="525" font-size="11" fill="#4f46e5">→ 3. Busca en tabla de páginas</text>
    <text x="100" y="550" font-size="11" fill="#4f46e5">→ 4. Obtiene número de marco</text>
    <text x="300" y="550" font-size="11" fill="#4f46e5">→ 5. Combina marco + offset</text>
    <text x="550" y="550" font-size="11" fill="#4f46e5">→ 6. Dirección física final</text>
    <text x="800" y="550" font-size="11" fill="#4f46e5">→ 7. Accede a memoria</text>
  </g>

  <!-- TLB -->
  <g id="tlb">
    <rect x="50" y="600" width="250" height="80" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="175" y="620" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">TLB (Translation Lookaside Buffer)</text>
    <text x="60" y="640" font-size="10" fill="#64748b">• Cache de traducciones recientes</text>
    <text x="60" y="655" font-size="10" fill="#64748b">• Acelera traducción de direcciones</text>
    <text x="60" y="670" font-size="10" fill="#16a34a">• Hit rate > 95% en sistemas típicos</text>
  </g>

  <!-- Page Fault -->
  <g id="page-fault">
    <rect x="320" y="600" width="300" height="80" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="470" y="620" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Page Fault (Fallo de Página)</text>
    <text x="330" y="640" font-size="10" fill="#7f1d1d">• Página referenciada no está en memoria</text>
    <text x="330" y="655" font-size="10" fill="#7f1d1d">• SO trae página desde disco (swap)</text>
    <text x="330" y="670" font-size="10" fill="#dc2626">• Costoso: miles de ciclos de CPU</text>
  </g>

  <!-- Thrashing -->
  <g id="thrashing">
    <rect x="640" y="600" width="310" height="80" rx="5" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
    <text x="795" y="620" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">Thrashing (Sobre-paginación)</text>
    <text x="650" y="640" font-size="10" fill="#92400e">• El sistema gasta más tiempo paginando que ejecutando</text>
    <text x="650" y="655" font-size="10" fill="#92400e">• Causa: working set > RAM disponible</text>
    <text x="650" y="670" font-size="10" fill="#ca8a04">• Solución: reducir multiprogramación o añadir RAM</text>
  </g>
</svg>