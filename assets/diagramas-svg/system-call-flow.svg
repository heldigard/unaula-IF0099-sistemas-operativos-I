<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" style="background: #f8fafc; font-family: Arial, sans-serif;">
  <!-- Título -->
  <text x="450" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">Flujo de una System Call (Llamada al Sistema)</text>

  <!-- Subtítulo -->
  <text x="450" y="55" text-anchor="middle" font-size="13" fill="#64748b">Cómo un programa solicita servicios del kernel de forma controlada</text>

  <!-- Columnas -->
  <line x1="300" y1="80" x2="300" y2="450" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="150" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">ESPACIO DE USUARIO</text>
  <text x="600" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">MODO KERNEL</text>

  <!-- Paso 1: Programa del usuario -->
  <g id="paso1">
    <rect x="50" y="100" width="200" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="150" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">1. Programa de usuario</text>
  </g>

  <!-- Flecha 1 -->
  <line x1="250" y1="120" x2="380" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="110" text-anchor="middle" font-size="10" fill="#2563eb">Llama a función libc</text>

  <!-- Paso 2: libc -->
  <g id="paso2">
    <rect x="380" y="100" width="180" height="40" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="470" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">2. Biblioteca libc</text>
  </g>

  <!-- Flecha 2 -->
  <line x1="560" y1="120" x2="630" y2="120" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="110" text-anchor="middle" font-size="10" fill="#4f46e5">Prepara parámetros</text>

  <!-- Paso 3: TRAP/Trap al kernel -->
  <g id="paso3">
    <rect x="630" y="160" width="200" height="40" rx="5" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
    <text x="730" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">3. TRAP (interrupción)</text>
  </g>

  <!-- Flecha 3 - cambio de modo -->
  <line x1="470" y1="140" x2="470" y2="160" stroke="#ca8a04" stroke-width="2"/>
  <line x1="470" y1="160" x2="630" y2="180" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="170" text-anchor="middle" font-size="10" fill="#ca8a04">Cambio modo usuario→kernel</text>

  <!-- Paso 4: System call handler -->
  <g id="paso4">
    <rect x="630" y="220" width="200" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="730" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">4. System call handler</text>
  </g>

  <!-- Flecha 4 -->
  <line x1="730" y1="200" x2="730" y2="220" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="215" text-anchor="start" font-size="10" fill="#16a34a">Valida y ejecuta</text>

  <!-- Paso 5: Operación del kernel -->
  <g id="paso5">
    <rect x="630" y="280" width="200" height="40" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="730" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#9f1239">5. Operación del kernel</text>
  </g>

  <!-- Flecha 5 -->
  <line x1="730" y1="260" x2="730" y2="280" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="275" text-anchor="start" font-size="10" fill="#db2777">Accede a hardware</text>

  <!-- Paso 6: Retorno -->
  <g id="paso6">
    <rect x="630" y="340" width="200" height="40" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="730" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">6. Retorno al usuario</text>
  </g>

  <!-- Flecha 6 -->
  <line x1="730" y1="320" x2="730" y2="340" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="335" text-anchor="start" font-size="10" fill="#4f46e5">Resultado + código error</text>

  <!-- Flecha 7 - vuelta al usuario -->
  <line x1="630" y1="360" x2="250" y2="360" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="350" text-anchor="middle" font-size="10" fill="#4f46e5">Cambio modo kernel→usuario</text>

  <!-- Paso 7: Programa continúa -->
  <g id="paso7">
    <rect x="50" y="340" width="200" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="150" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">7. Programa continúa</text>
  </g>

  <!-- Definición de flecha -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Caja de explicación -->
  <g id="explicacion">
    <rect x="50" y="420" width="800" height="60" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="450" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">¿Por qué este proceso es importante?</text>
    <text x="450" y="460" text-anchor="middle" font-size="11" fill="#64748b">Las system calls son la ÚNICA forma controlada en que los programas pueden acceder al kernel</text>
  </g>
</svg>